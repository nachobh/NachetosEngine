<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="HTML created by Nachetos Engine">
    <meta name="author" content="Ignacio Benito Herrero">
    <title>Nachetos Engine</title>
</head>
<body>
    <header>
        <h1>Nachetos Engine</h1>
        <input type="file" id="templateLoader" accept=".json">
    </header>
    <main id="templateHtml">
        <h1 id="title">Template HTML</h1>
        <p id="description">Template HTML content</p>
    </main>
    <footer>
        <label for="templateJson">Raw JSON</label>
        <br/>
        <textarea id="templateJson"></textarea>
    </footer>
</body>
</html>
<script type="text/javascript">

    function parseTemplate(templateJsonText) {
        let templateObject = JSON.parse(templateJsonText);
        let screen = templateObject.screens.find((screen) => screen.first);
        let templateHtmlPreviewer = document.getElementById('templateHtml');
        let buttonsToRemove = [];
        let dialogsToRemove = [];
        let currentLanguageIso;
        let currentLanguageObject = templateObject.languages.find((language) => language.iso === (currentLanguageIso ?? 'es'));


        function translate(literal) {
            if (typeof literal === 'string' && literal.substring(0, 2) === '${') {
                let literalKey = literal.substring(2, literal.length - 1);
                return currentLanguageObject[literalKey];
            } else {
                return literal;
            }
        }

        function setMetaElements() {
            document.getElementById('title').innerText = translate(templateObject?.title?.content ?? '');
            document.getElementById('description').innerText = translate(templateObject?.description?.content ?? '');
        }

        function setTemplateHtmlPreviewerStyle() {
            templateHtmlPreviewer.style.backgroundColor = screen.background.color ?? document.body.style.backgroundColor;
            templateHtmlPreviewer.style.borderColor = screen.border.color ?? document.body.style.borderColor;
            templateHtmlPreviewer.style.borderWidth = screen.border.width != null
                ? screen.border.width + '%'
                : document.body.style.borderWidth;
        }

        function loadButtons() {
            let buttonsJson = screen.buttons;
            for (let buttonJson of buttonsJson) {
                let buttonHtml = document.createElement('button');
                buttonHtml.addEventListener('click', () => actions[buttonJson.action.name](buttonJson.action.args));
                buttonHtml.setAttribute('type', 'button');
                buttonHtml.textContent = translate(buttonJson?.text?.content ?? '');
                buttonHtml.style.marginLeft = buttonJson.position.x + '%';
                buttonHtml.style.marginTop = buttonJson.position.y + '%';
                buttonHtml.style.height = buttonJson.size.y + '%';
                buttonHtml.style.width = buttonJson.size.x + '%';
                buttonHtml.style.backgroundColor = buttonJson.background.color ?? buttonHtml.style.backgroundColor;
                buttonHtml.style.borderColor = buttonJson?.border?.color ?? buttonHtml.style.borderColor;
                buttonHtml.style.borderWidth = buttonJson?.border?.width != null
                    ? buttonJson.border.width + '%'
                    : buttonHtml.style.borderWidth;
                buttonHtml.style.borderRadius = buttonJson?.border?.radius != null
                    ? buttonJson.border.radius + '%'
                    : buttonHtml.style.borderRadius;
                buttonsToRemove.push(buttonHtml);
                templateHtmlPreviewer.appendChild(buttonHtml)
            }
        }

        function loadDialogs() {
            let dialogsJson = screen.dialogs;
            for (let dialogJson of dialogsJson) {
                let dialogHtml = document.createElement('div');
                //todo click on dialog must show next dialog? boolean on JSON?
                //dialog.addEventListener('click', () => actions[jsonButton.action.name](jsonButton.action.args));
                dialogHtml.innerText = translate(dialogJson?.text?.content ?? ''); //todo think about too much null safe, maybe some error is better?
                dialogHtml.style.marginLeft = dialogJson.position.x + '%'; //todo should define 'required' properties somehow?
                dialogHtml.style.marginTop = dialogJson.position.y + '%';
                dialogHtml.style.height = dialogJson.size.y + '%';
                dialogHtml.style.width = dialogJson.size.x + '%';
                dialogHtml.style.backgroundColor = dialogJson.background?.color ?? dialogHtml.style.backgroundColor;
                dialogHtml.style.borderColor = dialogJson.border.color ?? dialogHtml.style.borderColor;
                dialogHtml.style.borderWidth = dialogJson?.border?.width != null
                    ? dialogJson.border.width + '%'
                    : dialogHtml.style.borderWidth;
                dialogHtml.style.borderRadius = dialogJson?.border?.radius != null
                    ? dialogJson.border.radius + '%'
                    : dialogHtml.style.borderRadius;
                dialogsToRemove.push(dialogHtml);
                templateHtmlPreviewer.appendChild(dialogHtml)
            }
        }

        function loadPictures() {
            let picturesJson = screen.pictures;
            for (let pictureJson of picturesJson) {
                let pictureHtml = document.createElement('img');
                //todo click on dialog must show next dialog? boolean on JSON?
                //dialog.addEventListener('click', () => actions[jsonButton.action.name](jsonButton.action.args));
                pictureHtml.src = pictureJson?.image?.content ?? ''; //todo think about too much null safe, maybe some error is better?
                pictureHtml.style.marginLeft = pictureJson.position.x + '%'; //todo should define 'required' properties somehow?
                pictureHtml.style.marginTop = pictureJson.position.y + '%';
                pictureHtml.style.height = pictureJson.size.y + '%';
                pictureHtml.style.width = pictureJson.size.x + '%';
                pictureHtml.style.backgroundColor = pictureJson.background?.color ?? pictureHtml.style.backgroundColor;
                pictureHtml.style.borderColor = pictureJson.border.color ?? pictureHtml.style.borderColor;
                pictureHtml.style.borderWidth = pictureJson?.border?.width != null
                    ? pictureJson.border.width + '%'
                    : pictureHtml.style.borderWidth;
                pictureHtml.style.borderRadius = pictureJson?.border?.radius != null
                    ? pictureJson.border.radius + '%'
                    : pictureHtml.style.borderRadius;
                dialogsToRemove.push(pictureHtml);
                templateHtmlPreviewer.appendChild(pictureHtml)
            }
        }

        const actions = {
            loadScreen: function(screenIdToLoad) {
                buttonsToRemove.forEach(button => {templateHtmlPreviewer.removeChild(button);})
                dialogsToRemove.forEach(dialog => {templateHtmlPreviewer.removeChild(dialog);})
                buttonsToRemove = []
                dialogsToRemove = []
                screen = templateObject.screens.find((screen) => screen.id === screenIdToLoad[0]);
                setTemplateHtmlPreviewerStyle();
                loadButtons()
                loadDialogs()
            },
            exit: function() { //todo delete or see how to make it work. Maybe a first screen as menu?
                window.close();
                let customWindow = window.open('', '_blank', '');
                customWindow.close();
            }
        }

        setMetaElements()
        setTemplateHtmlPreviewerStyle();
        loadButtons();
        loadDialogs();
        loadPictures();
    }

    function readTemplate(templateLoaderEvent) {
        resetTemplate();
        let templateFile = templateLoaderEvent.target.files[0];
        let templateJsonTextArea = document.getElementById("templateJson");
        let templateJsonFileReader = new FileReader();
        templateJsonFileReader.onload = () => {
            templateJsonTextArea.value = templateJsonFileReader.result;
            parseTemplate(templateJsonTextArea.value)
        }
        templateJsonFileReader.readAsText(templateFile);
    }

    function resetTemplate() {
        let templateHtmlPreviewer = document.getElementById('templateHtml');
        templateHtmlPreviewer.innerHTML = '\n' +
            '\t\t<h1 id="title">Template HTML</h1>\n' +
            '\t\t<p id="description">Template HTML content</p>' +
            '\n';
        templateHtmlPreviewer.style.backgroundColor = 'white';
        templateHtmlPreviewer.style.color = 'black';
        templateHtmlPreviewer.style.borderColor = 'transparent';
        templateHtmlPreviewer.style.borderWidth = '0px';
    }

    document.getElementById('templateLoader').addEventListener('change', readTemplate, false);
</script>
